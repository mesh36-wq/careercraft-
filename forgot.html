<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password – CareerCraft Kenya</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body" data-page="forgot">
<header class="auth-top">
 <a class="brand" href="index.html"><span class="logo-mark" aria-hidden="true">CC</span><span>CareerCraft <em>Kenya</em></span></a>
 <a class="back" href="login.html">&larr; Back to log in</a>
</header>
<main class="auth-main"><div class="auth-card">
 <h1>Forgot your password?</h1>
 <p class="auth-sub">Enter your email and we will send you a link to choose a new one.</p>
 <div id="alert" class="alert" hidden></div>
 <form id="form" novalidate>
  <div class="field"><label for="email">Email address</label>
   <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" aria-describedby="e-email">
   <small class="msg" id="e-email" aria-live="polite"></small></div>
  <button type="submit" class="btn btn-primary btn-block" id="submit">Send Reset Link</button>
 </form>
 <p class="auth-alt">Remembered it? <a class="lk" href="login.html">Log in</a>.</p>
</div></main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="site.js"></script>
<script src="auth.js"></script>
<script src="authpages.js"></script>
</body>
</html>
