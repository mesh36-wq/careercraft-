<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a New Password – CareerCraft Kenya</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body" data-page="reset">
<header class="auth-top">
 <a class="brand" href="index.html"><span class="logo-mark" aria-hidden="true">CC</span><span>CareerCraft <em>Kenya</em></span></a>
 <a class="back" href="login.html">&larr; Back to log in</a>
</header>
<main class="auth-main"><div class="auth-card">
 <h1>Choose a new password.</h1>
 <p class="auth-sub">Pick something you do not use anywhere else.</p>
 <div id="alert" class="alert" hidden></div>
 <p id="wait" class="small">Checking your reset link&hellip;</p>
 <div id="invalid" hidden>
  <div class="alert err" role="alert">This reset link is invalid or has expired.</div>
  <a class="btn btn-primary btn-block" href="forgot.html">Request a new link</a>
 </div>
 <form id="form" novalidate hidden>
  <div class="field"><label for="password">New password</label>
   <div class="pw"><input id="password" type="password" autocomplete="new-password" aria-describedby="e-password"><button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false"></button></div>
   <small class="msg" id="e-password" aria-live="polite"></small>
   <div class="meter" id="meter" data-s="0" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
   <p class="small" id="meterTxt" aria-live="polite" style="margin:0"></p>
   <ul class="reqs" id="reqs"></ul></div>
  <div class="field"><label for="confirm">Confirm new password</label>
   <div class="pw"><input id="confirm" type="password" autocomplete="new-password" aria-describedby="e-confirm"><button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false"></button></div>
   <small class="msg" id="e-confirm" aria-live="polite"></small></div>
  <button type="submit" class="btn btn-primary btn-block" id="submit">Update Password</button>
 </form>
</div></main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="site.js"></script>
<script src="auth.js"></script>
<script src="authpages.js"></script>
</body>
</html>
